name: Build Dylib with Embedded Lua

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút build thủ công trên web GitHub

jobs:
  build:
    runs-on: macos-latest # Sử dụng máy chủ macOS chính hãng

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Compile Dylib
      run: |
        echo "Bắt đầu biên dịch mã nguồn C++/Objective-C nhúng Lua..."
        mkdir -p build
        
        # Biên dịch trực tiếp bằng clang cho kiến trúc arm64 (iOS)
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          src/main.mm \
          -o build/SicBoMod.dylib \
          -framework Foundation
          
        echo "Biên dịch thành công!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: compiled-dylib
        path: build/SicBoMod.dylib
