name: Build ImGui Overlay Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Source Files Automatically
      run: |
        mkdir -p src

        # 1. Tạo file main.mm
        cat << 'EOF' > src/main.mm
        #import <Foundation/Foundation.h>
        #import <UIKit/UIKit.h>

        __attribute__((constructor)) void initNativeMod() {
            dispatch_async(dispatch_get_main_queue(), ^{
                NSLog(@"[SicBoMod] Dylib đã được inject thành công!");
                Class pubgLoadClass = NSClassFromString(@"PubgLoad");
                if (pubgLoadClass && [pubgLoadClass respondsToSelector:@selector(load)]) {
                    [pubgLoadClass performSelector:@selector(load)];
                    NSLog(@"[SicBoMod] Đã kích hoạt PubgLoad thành công!");
                } else {
                    NSLog(@"[SicBoMod] Không tìm thấy lớp PubgLoad.");
                }
            });
        }
        EOF

        # 2. Tạo file PubgLoad.mm
        cat << 'EOF' > src/PubgLoad.mm
        #import "PubgLoad.h"
        #import "ImGuiDrawView.h"

        @implementation PubgLoad

        + (void)setMenuVisible:(BOOL)visible {
        }

        + (void)load {
            static PubgLoad *sharedInstance = nil;
            static dispatch_once_t onceToken;
            dispatch_once(&onceToken, ^{
                sharedInstance = [[PubgLoad alloc] init];
                [sharedInstance bootstrapOverlay];
            });
        }

        - (void)bootstrapOverlay {
            dispatch_async(dispatch_get_main_queue(), ^{
                self.vna = [[ImGuiDrawView alloc] init];
                UIWindow *keyWindow = [[UIApplication sharedApplication] keyWindow];
                if (keyWindow && keyWindow.rootViewController) {
                    [keyWindow.rootViewController addChildViewController:self.vna];
                    [keyWindow.rootViewController.view addSubview:self.vna.view];
                    [self.vna didMoveToParentViewController:keyWindow.rootViewController];
                }
                [self.vna viewDidLoad];
                [self setupMenuButton];
            });
        }

        - (void)setupMenuButton {
            self.menuButton = [UIButton buttonWithType:UIButtonTypeCustom];
            self.menuButton.frame = CGRectMake(40, 100, 45, 45);
            self.menuButton.backgroundColor = [UIColor colorWithRed:0.1 green:0.5 blue:0.9 alpha:0.8];
            self.menuButton.layer.cornerRadius = 22.5;
            self.menuButton.layer.borderWidth = 1.5;
            self.menuButton.layer.borderColor = [UIColor whiteColor].CGColor;
            [self.menuButton setTitle:@"MOD" forState:UIControlStateNormal];
            [self.menuButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
            self.menuButton.titleLabel.font = [UIFont boldSystemFontOfSize:12];
            
            [self.menuButton addTarget:self action:@selector(handleMenuButtonTap:) forControlEvents:UIControlEventTouchUpInside];
            
            UIWindow *keyWindow = [[UIApplication sharedApplication] keyWindow];
            if (keyWindow) {
                [keyWindow addSubview:self.menuButton];
                [keyWindow bringSubviewToFront:self.menuButton];
            }
        }

        - (void)handleMenuButtonTap:(id)sender {
            self.menuVisible = !self.menuVisible;
            [ImGuiDrawView showChange:self.menuVisible];
        }

        @end
        EOF

        # 3. Tạo file ImGuiDrawView.mm
        cat << 'EOF' > src/ImGuiDrawView.mm
        #import "ImGuiDrawView.h"
        #import <MetalKit/MetalKit.h>

        @implementation ImGuiDrawView

        + (void)startRuntimeInitialization {
            NSLog(@"[ImGuiDrawView] Khởi chạy runtime ImGui.");
        }

        + (id)renderDiagnostics {
            return @"Diagnostics OK";
        }

        + (id)runtimeMessage {
            return @"Running Metal ImGui Overlay";
        }

        + (long long)runtimeState {
            return 1;
        }

        + (BOOL)menuIsVisible {
            return YES;
        }

        + (void)showChange:(BOOL)visible {
            NSLog(@"[ImGuiDrawView] Trạng thái menu hiển thị: %d", visible);
        }

        - (void)viewDidLoad {
            [super viewDidLoad];
            self.device = MTLCreateSystemDefaultDevice();
            if (!self.device) {
                return;
            }
            
            self.commandQueue = [self.device newCommandQueue];
            
            MTKView *mtkView = [[MTKView alloc] initWithFrame:self.view.bounds device:self.device];
            mtkView.delegate = self;
            mtkView.clearColor = MTLClearColorMake(0, 0, 0, 0);
            mtkView.backgroundColor = [UIColor clearColor];
            mtkView.userInteractionEnabled = NO;
            
            [self.view addSubview:mtkView];
            self.mtkView = mtkView;
        }

        - (void)drawInMTKView:(MTKView *)view {
        }

        - (void)mtkView:(MTKView *)view drawableSizeWillChange:(CGSize)size {
        }

        @end
        EOF

    - name: Compile Native Dylib
      run: |
        echo "Bắt đầu biên dịch dylib cho iOS (arm64)..."
        mkdir -p build
        
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          src/main.mm \
          src/PubgLoad.mm \
          src/ImGuiDrawView.mm \
          -o build/SicBoMod.dylib \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          -framework QuartzCore
          
        echo "Biên dịch thành công!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: build/SicBoMod.dylib
