name: Build ImGui Overlay Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Native Dylib
      run: |
        echo "Bắt đầu biên dịch dylib cho iOS (arm64)..."
        mkdir -p build
        
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -fobjc-arc \
          src/main.mm \
          src/PubgLoad.mm \
          src/ImGuiDrawView.mm \
          -o build/SicBoMod.dylib \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework MetalKit \
          -framework QuartzCore
          
        echo "Biên dịch thành công!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: build/SicBoMod.dylib
