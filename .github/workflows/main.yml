name: Build Native UIKit Overlay Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Source Files Automatically
      run: |
        mkdir -p src

        # 1. Tạo file PubgLoad.h
        cat << 'EOF' > src/PubgLoad.h
        #import <Foundation/Foundation.h>
        #import <UIKit/UIKit.h>

        @interface PubgLoad : NSObject
        @property (nonatomic, assign) BOOL menuVisible;
        + (void)load;
        @end
        EOF

        # 2. Tạo file ImGuiDrawView.h
        cat << 'EOF' > src/ImGuiDrawView.h
        #import <UIKit/UIKit.h>

        @interface ImGuiDrawView : UIViewController
        + (BOOL)menuIsVisible;
        + (void)showChange:(BOOL)visible;
        @end
        EOF

        # 3. Tạo file main.mm
        cat << 'EOF' > src/main.mm
        #import <Foundation/Foundation.h>
        #import <UIKit/UIKit.h>

        __attribute__((constructor)) void initNativeMod() {
            dispatch_async(dispatch_get_main_queue(), ^{
                NSLog(@"[SicBoMod] Dylib đã được inject thành công!");
                Class pubgLoadClass = NSClassFromString(@"PubgLoad");
                if (pubgLoadClass && [pubgLoadClass respondsToSelector:@selector(load)]) {
                    [pubgLoadClass performSelector:@selector(load)];
                }
            });
        }
        EOF

        # 4. Tạo file PubgLoad.mm
        cat << 'EOF' > src/PubgLoad.mm
        #import "PubgLoad.h"
        #import "ImGuiDrawView.h"

        @implementation PubgLoad

        + (void)load {
            static PubgLoad *sharedInstance = nil;
            static dispatch_once_t onceToken;
            dispatch_once(&onceToken, ^{
                sharedInstance = [[PubgLoad alloc] init];
                [sharedInstance setupGestures];
            });
        }

        - (void)setupGestures {
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                UIWindow *keyWindow = nil;
                for (UIWindow *scene in [[UIApplication sharedApplication] connectedScenes]) {
                    if ([scene isKindOfClass:[UIWindowScene class]]) {
                        for (UIWindow *window in [(UIWindowScene *)scene windows]) {
                            if (window.isKeyWindow) {
                                keyWindow = window;
                                break;
                            }
                        }
                    }
                }
                if (!keyWindow) {
                    keyWindow = [[UIApplication sharedApplication] keyWindow];
                }
                
                if (keyWindow) {
                    // Chạm 3 ngón tay để MỞ menu
                    UITapGestureRecognizer *threeFingerTap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(handleThreeFingerTap:)];
                    threeFingerTap.numberOfTouchesRequired = 3;
                    [keyWindow addGestureRecognizer:threeFingerTap];
                    
                    // Chạm 2 ngón tay để TẮT menu
                    UITapGestureRecognizer *twoFingerTap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(handleTwoFingerTap:)];
                    twoFingerTap.numberOfTouchesRequired = 2;
                    [keyWindow addGestureRecognizer:twoFingerTap];
                    
                    NSLog(@"[SicBoMod] Đã kích hoạt thành công cử chỉ cảm ứng!");
                }
            });
        }

        - (void)handleThreeFingerTap:(UITapGestureRecognizer *)gesture {
            self.menuVisible = YES;
            [ImGuiDrawView showChange:YES];
        }

        - (void)handleTwoFingerTap:(UITapGestureRecognizer *)gesture {
            self.menuVisible = NO;
            [ImGuiDrawView showChange:NO];
        }

        @end
        EOF

        # 5. Tạo file ImGuiDrawView.mm
        cat << 'EOF' > src/ImGuiDrawView.mm
        #import "ImGuiDrawView.h"
        #import <CoreGraphics/CoreGraphics.h>

        static UIView *modMenuView = nil;
        static BOOL isMenuShown = NO;

        @implementation ImGuiDrawView

        + (BOOL)menuIsVisible {
            return isMenuShown;
        }

        + (void)showChange:(BOOL)visible {
            isMenuShown = visible;
            dispatch_async(dispatch_get_main_queue(), ^{
                UIWindow *keyWindow = nil;
                for (UIWindow *scene in [[UIApplication sharedApplication] connectedScenes]) {
                    if ([scene isKindOfClass:[UIWindowScene class]]) {
                        for (UIWindow *w in [(UIWindowScene *)scene windows]) {
                            if (w.isKeyWindow) { keyWindow = w; break; }
                        }
                    }
                }
                if (!keyWindow) {
                    keyWindow = [[UIApplication sharedApplication] keyWindow];
                }
                
                if (visible) {
                    if (!modMenuView && keyWindow) {
                        // Khung Menu chính
                        modMenuView = [[UIView alloc] initWithFrame:CGRectMake(50, 60, 300, 250)];
                        modMenuView.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.15 alpha:0.95];
                        modMenuView.layer.cornerRadius = 14.0;
                        modMenuView.layer.borderWidth = 2.0;
                        modMenuView.layer.borderColor = [UIColor colorWithRed:0.0 green:0.6 blue:1.0 alpha:1.0].CGColor;
                        
                        // Tiêu đề
                        UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 10, 280, 30)];
                        titleLabel.text = @"👑 SICBO MOD MENU";
                        titleLabel.textColor = [UIColor whiteColor];
                        titleLabel.font = [UIFont boldSystemFontOfSize:16];
                        titleLabel.textAlignment = NSTextAlignmentCenter;
                        [modMenuView addSubview:titleLabel];
                        
                        // Nút chức năng 1
                        UIButton *btn1 = [UIButton buttonWithType:UIButtonTypeSystem];
                        btn1.frame = CGRectMake(15, 50, 270, 40);
                        btn1.backgroundColor = [UIColor colorWithRed:0.2 green:0.4 blue:0.8 alpha:1.0];
                        [btn1 setTitle:@"[ ] Hack Balance 999,999,999" forState:UIControlStateNormal];
                        [btn1 setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                        btn1.layer.cornerRadius = 8.0;
                        [btn1 addTarget:self action:@selector(toggleFeature1:) forControlEvents:UIControlEventTouchUpInside];
                        [modMenuView addSubview:btn1];
                        
                        // Nút chức năng 2
                        UIButton *btn2 = [UIButton buttonWithType:UIButtonTypeSystem];
                        btn2.frame = CGRectMake(15, 100, 270, 40);
                        btn2.backgroundColor = [UIColor colorWithRed:0.2 green:0.4 blue:0.8 alpha:1.0];
                        [btn2 setTitle:@"[ ] No Lose Line (Multiplayer)" forState:UIControlStateNormal];
                        [btn2 setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                        btn2.layer.cornerRadius = 8.0;
                        [btn2 addTarget:self action:@selector(toggleFeature2:) forControlEvents:UIControlEventTouchUpInside];
                        [modMenuView addSubview:btn2];
                        
                        // Nút đóng menu
                        UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                        closeBtn.frame = CGRectMake(50, 190, 200, 40);
                        closeBtn.backgroundColor = [UIColor colorWithRed:0.8 green:0.2 blue:0.2 alpha:1.0];
                        [closeBtn setTitle:@"Đóng Menu (2 Ngón)" forState:UIControlStateNormal];
                        [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                        closeBtn.layer.cornerRadius = 8.0;
                        [closeBtn addTarget:self action:@selector(closeMenuTapped:) forControlEvents:UIControlEventTouchUpInside];
                        [modMenuView addSubview:closeBtn];
                        
                        // Thêm tính năng kéo thả bảng menu đi khắp màn hình
                        UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(panMenu:)];
                        [modMenuView addGestureRecognizer:pan];
                    }
                    
                    if (modMenuView && !modMenuView.superview && keyWindow) {
                        [keyWindow addSubview:modMenuView];
                        [keyWindow bringSubviewToFront:modMenuView];
                    }
                    modMenuView.hidden = NO;
                } else {
                    if (modMenuView) {
                        modMenuView.hidden = YES;
                    }
                }
            });
        }

        + (void)panMenu:(UIPanGestureRecognizer *)pan {
            CGPoint translation = [pan translationInView:modMenuView.superview];
            CGPoint center = modMenuView.center;
            modMenuView.center = CGPointMake(center.x + translation.x, center.y + translation.y);
            [pan setTranslation:CGPointMake(0, 0) inView:modMenuView.superview];
        }

        + (void)toggleFeature1:(UIButton *)sender {
            static BOOL active = NO;
            active = !active;
            sender.backgroundColor = active ? [UIColor colorWithRed:0.1 green:0.7 blue:0.3 alpha:1.0] : [UIColor colorWithRed:0.2 green:0.4 blue:0.8 alpha:1.0];
            [sender setTitle:active ? @"[✔] Hack Balance 999,999,999" : @"[ ] Hack Balance 999,999,999" forState:UIControlStateNormal];
        }

        + (void)toggleFeature2:(UIButton *)sender {
            static BOOL active = NO;
            active = !active;
            sender.backgroundColor = active ? [UIColor colorWithRed:0.1 green:0.7 blue:0.3 alpha:1.0] : [UIColor colorWithRed:0.2 green:0.4 blue:0.8 alpha:1.0];
            [sender setTitle:active ? @"[✔] No Lose Line (Multiplayer)" : @"[ ] No Lose Line (Multiplayer)" forState:UIControlStateNormal];
        }

        + (void)closeMenuTapped:(id)sender {
            [self showChange:NO];
        }

        @end
        EOF

    - name: Compile Native Dylib
      run: |
        echo "Bắt đầu biên dịch dylib..."
        mkdir -p build
        
        clang++ -dynamiclib \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -Isrc \
          -fobjc-arc \
          -Wno-deprecated-declarations \
          src/main.mm \
          src/PubgLoad.mm \
          src/ImGuiDrawView.mm \
          -o build/SicBoMod.dylib \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework QuartzCore
          
        echo "Biên dịch thành công!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-dylib
        path: build/SicBoMod.dylib
